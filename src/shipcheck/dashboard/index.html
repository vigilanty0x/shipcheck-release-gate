<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipcheck</title><link rel="stylesheet" href="/app.css"></head>
<body><main><header><div><p class="eyebrow">EVIDENCE-FIRST RELEASE CONTROL</p><h1>Shipcheck ledger</h1><p>Read-only loopback view. No merge, build, or deployment controls exist here.</p></div><span id="health">local</span></header><section class="auth"><label>Session token <input id="token" type="password" autocomplete="off" placeholder="Paste the token printed by shipcheck serve"></label><button id="load">Load ledger</button></section><section class="stats"><article><span>Integrity</span><strong id="integrity">—</strong></article><article><span>Entries</span><strong id="count">—</strong></article><article><span>Tail</span><strong id="tail">—</strong></article></section><section><h2>Recent decisions and receipts</h2><div id="error" role="alert"></div><div id="entries" class="entries"></div></section></main><script src="/app.js" defer></script></body></html>
